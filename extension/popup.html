<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Google Calendar Event Length</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
  <script src="calendar.js" defer></script>
</head>
<body>
  <main class="popup">
    <canvas id="calendar" aria-hidden="true"></canvas>
    <h1>Event Duration</h1>
    <p class="subtitle">Show event lengths in Google Calendar.</p>
    <label class="switch"><span>Show durations</span><input id="enabled" type="checkbox" role="switch" checked disabled aria-describedby="status"></label>
    <fieldset disabled aria-describedby="status">
      <legend>Duration style</legend>
      <label class="option"><input type="radio" name="style" value="box"><span>Outlined box</span><b aria-hidden="true">1h</b></label>
      <label class="option"><input type="radio" name="style" value="text"><span>Parentheses</span><i aria-hidden="true">(1 hr)</i></label>
    </fieldset>
    <p id="status" class="status" role="status">Loading…</p>
  </main>
</body>
</html>
