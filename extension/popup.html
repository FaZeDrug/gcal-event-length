<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Google Calendar Event Length</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
  <script src="sakura.js" defer></script>
</head>
<body>
  <main class="popup">
  <div class="ornament" aria-hidden="true"><img class="poster" src="poster.svg" alt=""><canvas width="300" height="170"></canvas></div>
  <header><h1>Google Calendar<br>Event Length</h1><p>Show event durations beside the time<br>in Google Calendar.</p></header>
  <fieldset disabled aria-describedby="status">
    <legend>Duration style</legend>
    <label><input type="radio" name="style" value="box"><span>Outlined box</span><b aria-hidden="true">1h</b></label>
    <label><input type="radio" name="style" value="text"><span>Parentheses</span><i aria-hidden="true">(1 hr)</i></label>
  </fieldset>
  <p id="status" class="status" role="status">Loading preference…</p>
  <footer>Changes apply automatically to open Calendar tabs.<br>Day and Week views only.</footer>
  </main>
</body>
</html>
