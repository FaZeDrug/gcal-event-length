<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Calendar Event Length</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <h1>Calendar Event Length</h1>
  <p>Show event durations beside the time in Google Calendar.</p>
  <fieldset disabled>
    <legend>Duration style</legend>
    <label><input type="radio" name="style" value="box"> Outlined box — <span class="example">1h</span></label>
    <label><input type="radio" name="style" value="text"> Parentheses — (1 hr)</label>
  </fieldset>
  <p id="status" role="status">Loading preference…</p>
  <p>Changes apply automatically to open Calendar tabs. Day and Week views only.</p>
</body>
</html>
